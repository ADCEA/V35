<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ma tournée — Blanchisserie Cézanne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16324F; --brand:#1D91FF; --brand-deep:#0F6FCB;
  --steel:#64798D; --steel-light:#AFC0CF; --bg:#F5F8FC; --paper:#FFFFFF;
  --line:#DEE6EE; --teal:#2FB27A; --rust:#E0574B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom, 24px);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}

/* ---------- en-tête ---------- */
header{background:var(--ink);color:#fff;padding:22px 16px 26px;}
header .wrap{padding:0 16px;}
header .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8FB4D9;margin:0 0 4px;}
header h1{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;margin:0 0 2px;}
header .date{font-size:13px;color:#B7CEE6;}

/* ---------- carte météo ---------- */
.weather-card{
  background:var(--paper); border-radius:12px; margin:-16px 0 16px;
  box-shadow:0 8px 24px rgba(22,50,79,0.12); overflow:hidden;
}
.weather-main{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.weather-icon{width:44px;height:44px;flex-shrink:0;}
.weather-info{flex:1;}
.weather-cond{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;}
.weather-range{font-size:12.5px;color:var(--steel);margin-top:1px;}
.weather-detail{font-size:11px;color:var(--steel-light);margin-top:2px;}
.weather-danger{
  background:var(--rust); color:#fff; padding:10px 18px;
  font-size:12.5px; line-height:1.5;
}
.weather-danger div{padding:2px 0;}
.weather-danger .dtitle{font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;margin-bottom:4px;opacity:0.9;}
.weather-ok{background:var(--teal);color:#fff;padding:8px 18px;font-size:12px;font-weight:500;}

/* ---------- conseils sécurité ---------- */
.safety-strip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;}
.safety-strip h3{font-family:'Fredoka',sans-serif;font-size:12.5px;margin:0 0 8px;color:var(--brand-deep);display:flex;align-items:center;gap:6px;}
.safety-strip ul{margin:0;padding:0;list-style:none;}
.safety-strip li{font-size:12px;color:var(--steel);padding:4px 0 4px 16px;position:relative;line-height:1.4;}
.safety-strip li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand);}

/* ---------- résumé tournée ---------- */
.route-summary{display:flex;gap:10px;margin-bottom:20px;}
.route-summary .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
.route-summary .stat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px;color:var(--ink);}
.route-summary .stat span{font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- ligne de parcours (élément signature) ---------- */
.route{position:relative;padding-left:38px;}
.route::before{
  content:''; position:absolute; left:15px; top:8px; bottom:8px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--brand) 0 6px, transparent 6px 11px);
}
.stop{position:relative;margin-bottom:14px;}
.stop-num{
  position:absolute; left:-38px; top:0; width:32px; height:32px; border-radius:50%;
  background:var(--brand); color:#fff; font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(29,145,255,0.35);
  z-index:1;
}
.stop-dist{font-size:10px;color:var(--steel-light);margin:-6px 0 6px 2px;}
.stop-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.stop-societe{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;margin-bottom:2px;}
.stop-ticket{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel-light);margin-bottom:8px;}
.stop-addr{font-size:13px;color:var(--steel);margin-bottom:10px;line-height:1.4;}
.stop-actions{display:flex;gap:8px;margin-bottom:10px;}
.stop-actions a{
  flex:1; text-align:center; padding:9px; border-radius:8px; font-size:12.5px; font-weight:500;
  text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
}
.stop-actions .maps{background:var(--brand);color:#fff;}
.stop-actions .call{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-actions .bl{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-items{font-size:11.5px;color:var(--steel);border-top:1px solid var(--line);padding-top:8px;}
.stop-items span{display:inline-block;margin:2px 8px 2px 0;}
.comment-toggle{width:100%;margin-top:10px;padding:9px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;}
.comment-box{display:none;margin-top:10px;}
.comment-box.open{display:block;}
.comment-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13px;resize:vertical;min-height:60px;box-sizing:border-box;}
.comment-box button{margin-top:6px;width:100%;padding:9px;border-radius:8px;background:var(--brand);color:#fff;border:none;font-size:12.5px;font-weight:500;}
.comment-sent{font-size:11.5px;color:var(--teal);font-weight:600;margin-top:6px;display:none;}
.comment-sent.show{display:block;}

.empty, .loading, .error{text-align:center;padding:60px 20px;color:var(--steel);font-size:14px;}
.error{color:var(--rust);}

footer{text-align:center;font-size:11px;color:var(--steel-light);padding:20px 16px 10px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading">Chargement de votre tournée…</div>
</div>

<script src="/tournee.js"></script>
</body>
</html>
