<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ma tournée — Blanchisserie Cézanne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16324F; --brand:#1D91FF; --brand-deep:#0F6FCB;
  --steel:#64798D; --steel-light:#AFC0CF; --bg:#F5F8FC; --paper:#FFFFFF;
  --line:#DEE6EE; --teal:#2FB27A; --rust:#E0574B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom, 24px);
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;}

/* ---------- en-tête ---------- */
header{background:var(--ink);color:#fff;padding:22px 16px 26px;}
header .wrap{padding:0 16px;}
header .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8FB4D9;margin:0 0 4px;}
header h1{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;margin:0 0 2px;}
header .date{font-size:13px;color:#B7CEE6;}

/* ---------- carte météo ---------- */
.weather-card{
  background:var(--paper); border-radius:12px; margin:-16px 0 16px;
  box-shadow:0 8px 24px rgba(22,50,79,0.12); overflow:hidden;
}
.weather-main{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.weather-icon{width:44px;height:44px;flex-shrink:0;}
.weather-info{flex:1;}
.weather-cond{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;}
.weather-range{font-size:12.5px;color:var(--steel);margin-top:1px;}
.weather-detail{font-size:11px;color:var(--steel-light);margin-top:2px;}
.weather-danger{
  background:var(--rust); color:#fff; padding:10px 18px;
  font-size:12.5px; line-height:1.5;
}
.weather-danger div{padding:2px 0;}
.weather-danger .dtitle{font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:0.05em;margin-bottom:4px;opacity:0.9;}
.weather-ok{background:var(--teal);color:#fff;padding:8px 18px;font-size:12px;font-weight:500;}

/* ---------- conseils sécurité ---------- */
.safety-strip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;}
.safety-strip h3{font-family:'Fredoka',sans-serif;font-size:12.5px;margin:0 0 8px;color:var(--brand-deep);display:flex;align-items:center;gap:6px;}
.safety-strip ul{margin:0;padding:0;list-style:none;}
.safety-strip li{font-size:12px;color:var(--steel);padding:4px 0 4px 16px;position:relative;line-height:1.4;}
.safety-strip li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand);}

/* ---------- résumé tournée ---------- */
.route-summary{display:flex;gap:10px;margin-bottom:20px;}
.route-summary .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
.route-summary .stat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px;color:var(--ink);}
.route-summary .stat span{font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}

/* ---------- ligne de parcours (élément signature) ---------- */
.route{position:relative;padding-left:38px;}
.route::before{
  content:''; position:absolute; left:15px; top:8px; bottom:8px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--brand) 0 6px, transparent 6px 11px);
}
.stop{position:relative;margin-bottom:14px;}
.stop-num{
  position:absolute; left:-38px; top:0; width:32px; height:32px; border-radius:50%;
  background:var(--brand); color:#fff; font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(29,145,255,0.35);
  z-index:1;
}
.stop-dist{font-size:10px;color:var(--steel-light);margin:-6px 0 6px 2px;}
.stop-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.stop-societe{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;margin-bottom:2px;}
.stop-ticket{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel-light);margin-bottom:8px;}
.stop-addr{font-size:13px;color:var(--steel);margin-bottom:10px;line-height:1.4;}
.stop-actions{display:flex;gap:8px;margin-bottom:10px;}
.stop-actions a{
  flex:1; text-align:center; padding:9px; border-radius:8px; font-size:12.5px; font-weight:500;
  text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
}
.stop-actions .maps{background:var(--brand);color:#fff;}
.stop-actions .call{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-actions .bl{background:var(--bg);color:var(--ink);border:1px solid var(--line);}
.stop-collect{display:inline-block;margin:0 0 8px;padding:3px 9px;border:1px dashed var(--teal);border-radius:999px;font-size:12px;font-weight:600;color:var(--teal);}
.stop-note{font-size:12.5px;color:var(--steel);margin:0 0 8px;}
.stop-items{font-size:11.5px;color:var(--steel);border-top:1px solid var(--line);padding-top:8px;}
.stop-items span{display:inline-block;margin:2px 8px 2px 0;}
.comment-toggle{width:100%;margin-top:10px;padding:9px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;}
.comment-box{display:none;margin-top:10px;}
.comment-box.open{display:block;}
.comment-box textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13px;resize:vertical;min-height:60px;box-sizing:border-box;}
.comment-box button{margin-top:6px;width:100%;padding:9px;border-radius:8px;background:var(--brand);color:#fff;border:none;font-size:12.5px;font-weight:500;}
.comment-sent{font-size:11.5px;color:var(--teal);font-weight:600;margin-top:6px;display:none;}
.comment-sent.show{display:block;}

/* ---------- partage de position ---------- */
.share-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:16px 0 14px;}
.share-card.on{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal);}
.share-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px;}
.share-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1.6s ease-out infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,178,122,.5);}100%{box-shadow:0 0 0 9px rgba(47,178,122,0);}}
@media (prefers-reduced-motion:reduce){.share-dot{animation:none;}}
.share-card p{margin:0 0 10px;font-size:12px;line-height:1.45;color:var(--steel);}
.share-card .share-error{color:var(--rust);font-weight:500;}
.share-btn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--brand);color:#fff;font-size:13px;font-weight:600;}
.share-btn.stop{background:var(--bg);color:var(--ink);border:1px solid var(--line);}

/* ---------- trafic en temps réel (tournee-trafic.js) ---------- */
.tr-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 20px;}
.tr-card[hidden],.tr-eta[hidden],#tr-mapbox[hidden]{display:none;}
.tr-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tr-pill{display:inline-flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif;font-size:14.5px;font-weight:600;padding:6px 12px 6px 10px;border-radius:999px;background:#E6F6EE;color:#136B46;}
.tr-pill::before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;}
.tr-pill.mid{background:#FFF1D6;color:#7C5200;}
.tr-pill.bad{background:#FCE6E3;color:#A8321F;}
.tr-refresh{margin-left:auto;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;line-height:1;}
.tr-refresh:disabled{opacity:.55;}
.tr-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 14px;margin:0 0 8px;}
.tr-facts div{min-width:0;}
.tr-facts dt{font-size:11.5px;color:var(--steel);}
.tr-facts dd{margin:1px 0 0;font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600;color:var(--ink);}
.tr-facts dd small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:400;color:var(--steel);}
.tr-note{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--steel);}
.tr-err{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--rust);font-weight:500;}
.tr-map-btn{width:100%;min-height:44px;margin-top:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:500;}
.tr-refresh:focus-visible,.tr-map-btn:focus-visible,.tr-chk input:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.tr-mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;font-size:12.5px;}
.tr-chk{display:flex;align-items:center;gap:8px;min-height:36px;}
.tr-chk input{width:20px;height:20px;accent-color:var(--brand);}
.tr-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--steel);}
.tr-legend i{display:block;width:54px;height:7px;border-radius:4px;background:linear-gradient(90deg,#3BB273,#F2C230,#E0574B,#8A1F1F);}
#tr-map{height:min(58vh,380px);border-radius:10px;border:1px solid var(--line);font-family:inherit;}
.tr-pin span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(22,50,79,.45);font-family:'Fredoka',sans-serif;font-size:14px;font-weight:600;}
.tr-depot span{border-radius:8px;background:var(--ink);}
.tr-me span{width:18px;height:18px;margin:6px;background:#1D91FF;border-width:3px;box-shadow:0 0 0 3px rgba(29,145,255,.3);}
.tr-from span{width:16px;height:16px;margin:7px;background:var(--steel);border-width:2px;font-size:0;}
.tr-pop{font-size:12.5px;line-height:1.45;}
.tr-pop-name{font-weight:600;}
.tr-mute{color:var(--steel);}
.tr-eta{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 10px;margin:-4px 0 10px;font-size:12.5px;color:var(--steel);}
.tr-eta b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px;color:var(--ink);}
.tr-delay{font-weight:600;}
.tr-delay.mid{color:#7C5200;}
.tr-delay.bad{color:#A8321F;}

/* ---------- validation d'une livraison ---------- */
.deliver-zone{margin-top:12px;}
.deliver-btn{width:100%;padding:13px;border-radius:9px;border:none;background:var(--teal);color:#fff;font-size:14px;font-weight:600;}
.deliver-confirm p{margin:0 0 8px;font-size:13px;color:var(--ink);}
.deliver-confirm[hidden],.deliver-btn[hidden]{display:none;}
.deliver-row{display:flex;gap:8px;}
.deliver-yes{flex:2;padding:13px;border-radius:9px;border:none;background:var(--teal);color:#fff;font-size:14px;font-weight:600;}
.deliver-no{flex:1;padding:13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;}
.deliver-yes:disabled{opacity:.6;}

/* ---------- livré aujourd'hui ---------- */
.done-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:22px 0 4px;}
.done-box h3{font-family:'Fredoka',sans-serif;font-size:14px;margin:0 0 6px;color:var(--teal);}
.done-box ul{list-style:none;margin:0;padding:0;}
.done-box li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;}
.done-box li:first-child{border-top:none;}
.done-check{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.done-name{flex:1;min-width:0;}
.done-name small,.done-time small{display:block;font-size:10.5px;color:var(--steel-light);}
.done-time{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.finished{text-align:center;padding:36px 20px 8px;color:var(--teal);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;}

.empty, .loading, .error{text-align:center;padding:60px 20px;color:var(--steel);font-size:14px;}
.error{color:var(--rust);}

footer{text-align:center;font-size:11px;color:var(--steel-light);padding:20px 16px 10px;}
</style>
</head>
<body>
<div id="app">
  <div class="loading">Chargement de votre tournée…</div>
</div>

<script src="/tournee.js"></script>
<script src="/tournee-trafic.js"></script>
</body>
</html>
